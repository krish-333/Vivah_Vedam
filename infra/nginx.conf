# /etc/nginx/sites-available/vivah-vedam
# Reverse proxy: 80/443 (nginx) -> 127.0.0.1:3000 (next start / PM2)
#
# Install:
#   sudo cp infra/nginx.conf /etc/nginx/sites-available/vivah-vedam
#   sudo ln -s /etc/nginx/sites-available/vivah-vedam /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run certbot (see AWS_DEPLOYMENT.md) to add the HTTPS server block for you.

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
